<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PET+</title>
    <script>
      // GitHub Pages SPA redirect — encodes the path as query param and
      // redirects to index.html, which decodes it back to the correct route.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') +
        '/?p=/' + l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
</html>
